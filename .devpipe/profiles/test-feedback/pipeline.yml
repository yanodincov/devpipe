version: 1
name: test-feedback

defaults:
  runner: auto
  model: middle
  effort: middle

inputs:
  task:
    type: string
    required: true
    default: ""
    custom: true
  severity:
    type: string
    required: false
    default: "minor"
    values: ["minor", "major", "critical"]
    custom: false
  auto_approve:
    type: bool
    required: false
    default: false
  component:
    type: string
    required: false
    default: ""
    custom: true
  max_iterations:
    type: int
    required: false
    default: 3
    values: [1, 2, 3, 4, 5]
    custom: true


stages:
  init:
    runner: codex
    model: low
    effort: low
    retry_limit: 1
    agent:
      prompt: agents/init/prompt.md
      output_schema: agents/init/output.schema.json
    in:
      task: input.task
      severity: input.severity
      component: input.component
      shared_context: context.shared
    out:
      initial_plan:
        type: object
      requires_review:
        type: bool

  review:
    runner: codex
    model: middle
    effort: middle
    retry_limit: 2
    agent:
      prompt: agents/review/prompt.md
      output_schema: agents/review/output.schema.json
    in:
      task: input.task
      plan: stage.init.out.initial_plan
      auto_approve: input.auto_approve
      shared_context: context.shared
    out:
      approved:
        type: bool
      feedback:
        type: string
      issues_found:
        type: int
      iteration:
        type: int

  fix:
    runner: codex
    model: high
    effort: high
    retry_limit: 2
    agent:
      prompt: agents/fix/prompt.md
      output_schema: agents/fix/output.schema.json
    in:
      task: input.task
      plan: stage.init.out.initial_plan
      feedback: stage.review.out.feedback
      iteration: stage.review.out.iteration
      shared_context: context.shared
    out:
      updated_plan:
        type: object
      changes_made:
        type: bool

  verify:
    runner: codex
    model: middle
    effort: middle
    retry_limit: 1
    agent:
      prompt: agents/verify/prompt.md
      output_schema: agents/verify/output.schema.json
    in:
      task: input.task
      plan: stage.fix.out.updated_plan if stage.fix.out.changes_made else stage.init.out.initial_plan
      shared_context: context.shared
    out:
      passed:
        type: bool
      defects:
        type: int

routing:
  start_stage: init
  by_stage:
    init:
      next_stages:
        - stage: review
          default: true
    review:
      next_stages:
        - stage: verify
          all:
            - field: out.approved
              op: eq
              value: true
            - field: out.issues_found
              op: eq
              value: 0
        - stage: fix
          any:
            - field: out.approved
              op: eq
              value: false
            - field: out.issues_found
              op: gt
              value: 0
            - field: out.auto_approve
              op: eq
              value: false
        - stage: completed
          default: true
    fix:
      next_stages:
        - stage: review
          all:
            - field: out.changes_made
              op: eq
              value: true
            - field: out.iteration
              op: lt
              value: input.max_iterations
        - stage: completed
          any:
            - field: out.iteration
              op: gte
              value: input.max_iterations
        - stage: completed
          default: true
    verify:
      next_stages:
        - stage: completed
          default: true
